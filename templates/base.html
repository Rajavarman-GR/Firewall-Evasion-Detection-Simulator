<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SOC Monitor{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/">SOC<br><small>MONITOR</small></a><p class="nav-label">OPERATIONS</p><a href="/">Dashboard</a><a href="/events">Events</a><a href="/incidents">Incidents</a><a href="/firewall">Firewall</a><p class="nav-label">ADMINISTRATION</p>{% if session.role == 'ADMIN' %}<a href="/admin/users">Users</a><a href="/admin/settings">Settings</a>{% endif %}<div class="sidebar-user">{% if session.username %}<b>{{ session.username }}</b><span>{{ session.role }}</span><a href="/logout">Logout</a>{% else %}<a href="/login">Login</a>{% endif %}</div></aside><main>{% block content %}{% endblock %}</main></div><script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
