{% extends 'base.html' %}{% block content %}<h1>User Management</h1><p>Administrative changes are persisted and enforced on every subsequent backend request.</p><section class="actions"><input id="new-user" placeholder="Username"><input id="new-password" type="password" placeholder="Password (10+ chars)"><select id="new-role"><option>VIEWER</option><option>ANALYST</option><option>ADMIN</option></select><button onclick="createUser()">Create user</button></section><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Created</th><th>Last login</th><th>Actions</th></tr></thead><tbody id="users-list"></tbody></table></div><p id="users-message"></p><script>document.addEventListener('DOMContentLoaded',loadUsers)</script>{% endblock %}
